<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Usage — Sunairio NL2SQL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="usage-page">
    <header class="header">
        <div class="header-left">
            <div class="logo">S</div>
            <div>
                <h1>Token Usage</h1>
                <div class="header-subtitle">Your monthly consumption</div>
            </div>
        </div>
        <div class="header-actions">
            <a class="btn-link" href="/chat">Chat</a>
            <span class="user-badge" id="usage-user-badge">—</span>
            <button class="btn-icon" onclick="logout()">Sign out</button>
        </div>
    </header>

    <main class="usage-main">
        <div class="usage-banner" id="usage-banner" hidden></div>

        <section class="usage-summary-card" id="usage-summary">
            <p class="table-empty">Loading…</p>
        </section>

        <section class="dashboard-section">
            <div class="section-header">
                <h2>Breakdown</h2>
                <div class="usage-tabs" id="usage-tabs">
                    <button class="usage-tab active" data-granularity="day">Day</button>
                    <button class="usage-tab" data-granularity="week">Week</button>
                    <button class="usage-tab" data-granularity="month">Month</button>
                    <button class="usage-tab" data-granularity="question">Question</button>
                </div>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Period / Question</th>
                            <th>Input</th>
                            <th>Output</th>
                            <th>Total</th>
                            <th>Queries</th>
                        </tr>
                    </thead>
                    <tbody id="usage-breakdown">
                        <tr><td colspan="5" class="table-empty">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/usage.js"></script>
</body>
</html>
